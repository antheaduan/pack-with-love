# Netlify configuration for Pack with Love
# This is a plain static HTML site — there is no build step, so Netlify just
# publishes the files in the repository root exactly as they are.

[build]
  publish = "."      # serve the site from the repo root (index.html, etc.)
  command = ""       # no build command — nothing to compile

# Sensible security + caching headers for a static site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# CSS/JS share fixed filenames (styles.css, main.js), so they must always be
# revalidated — otherwise browsers serve a stale stylesheet after every edit.
# max-age=0 + must-revalidate = instant updates, with cheap 304 responses.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images are edited in place under stable filenames during iteration, so
# always revalidate (cheap 304s) — otherwise a swapped image stays cached.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Canonical URLs: extensionless is the shared form, so 301 any /page.html
# request to /page. Netlify already serves /page from page.html.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/:page.html"
  to = "/:page"
  status = 301
  force = true

# /support retired — its chooser duplicated the Three Ways In ladder.
[[redirects]]
  from = "/support"
  to = "/give"
  status = 301
  force = true

# The participant handbook merged back into /participate (expandable Four Moves cards).
[[redirects]]
  from = "/participate/handbook"
  to = "/participate#moves"
  status = 301
  force = true

# News taken offline for launch.
[[redirects]]
  from = "/news"
  to = "/"
  status = 301
  force = true
